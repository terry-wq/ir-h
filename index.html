<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control IR por Audio Jack</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --body-bg: #22252a;
            --btn-gray: #3a3f47;
            --btn-light: #4f5663;
            --btn-red: #cc2222;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .remote-case {
            background: var(--body-bg);
            width: 260px;
            padding: 25px 18px;
            border-radius: 35px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            border: 2px solid #15181c;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-row { display: flex; justify-content: space-between; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

        button {
            border: none;
            background: var(--btn-gray);
            color: var(--text-color);
            font-size: 10px;
            font-weight: bold;
            padding: 10px 0;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 0 #111316;
        }

        button:active { transform: translateY(2px); background: #2563eb; }
        .btn-power { background: var(--btn-red); color: white; width: 40px; }
        .btn-mute { background: #2563eb; color: white; padding: 0 12px; }

        .dpad {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 10px auto;
            background: #17191d;
            border-radius: 50%;
        }

        .dpad button { position: absolute; width: 42px; height: 42px; border-radius: 50%; }
        .dpad-up { top: 5px; left: 59px; }
        .dpad-down { bottom: 5px; left: 59px; }
        .dpad-left { top: 59px; left: 5px; }
        .dpad-right { top: 59px; right: 5px; }
        .dpad-ok { top: 59px; left: 59px; background: #474f5c; }

        .warning {
            max-width: 280px;
            font-size: 11px;
            color: #f59e0b;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="warning">
        ⚠️ Sube el volumen del dispositivo al 100% para emitir la señal IR correctamente por el Jack de audífonos.
    </div>

    <div class="remote-case">
        <div class="top-row">
            <button class="btn-power" onclick="transmitirNEC(0x10EFEB14)">⏏</button>
            <button class="btn-mute" onclick="transmitirNEC(0x10EFFB04)">MUTE</button>
        </div>

        <div class="grid-3">
            <button onclick="transmitirNEC(0x10EFA956)">1</button>
            <button onclick="transmitirNEC(0x10EF9966)">2</button>
            <button onclick="transmitirNEC(0x10EFB946)">3</button>
            <button onclick="transmitirNEC(0x10EF6B94)">4</button>
            <button onclick="transmitirNEC(0x10EF5BA4)">5</button>
            <button onclick="transmitirNEC(0x10EF7B84)">6</button>
            <button onclick="transmitirNEC(0x10EF6996)">7</button>
            <button onclick="transmitirNEC(0x10EF59A6)">8</button>
            <button onclick="transmitirNEC(0x10EF7986)">9</button>
        </div>

        <div class="grid-3">
            <button onclick="transmitirNEC(0x10EF39C6)">⟲</button>
            <button onclick="transmitirNEC(0x10EF9B64)">0</button>
            <button onclick="transmitirNEC(0x10EFC33C)" style="background:#2563eb;">INPUT</button>
        </div>

        <div class="dpad">
            <button class="dpad-up" onclick="transmitirNEC(0x10EF03FC)">▲</button>
            <button class="dpad-down" onclick="transmitirNEC(0x10EF1BE4)">▼</button>
            <button class="dpad-left" onclick="transmitirNEC(0x10EFE916)">◀</button>
            <button class="dpad-right" onclick="transmitirNEC(0x10EFF906)">▶</button>
            <button class="dpad-ok" onclick="transmitirNEC(0x10EFD926)">OK</button>
        </div>

        <div class="grid-4">
            <button onclick="transmitirNEC(0x10EFE11E)">VOL+</button>
            <button onclick="transmitirNEC(0x10EFD12E)">VOL-</button>
            <button onclick="transmitirNEC(0x10EF01FE)">CH+</button>
            <button onclick="transmitirNEC(0x10EF718E)">CH-</button>
        </div>
    </div>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
            }
        }

        function transmitirNEC(hexCode) {
            initAudio();
            
            const carrierFreq = 19000; // 19 kHz (modulación a 38 kHz con doble LED)
            const pulseHeaderMark = 9000;  // 9ms
            const pulseHeaderSpace = 4500; // 4.5ms
            const bitMark = 560;           // 560us
            const oneSpace = 1690;         // 1.69ms
            const zeroSpace = 560;         // 560us

            let timings = [pulseHeaderMark, pulseHeaderSpace];

            // Convertir código a 32 bits binarios
            for (let i = 31; i >= 0; i--) {
                let bit = (hexCode >> i) & 1;
                timings.push(bitMark);
                timings.push(bit ? oneSpace : zeroSpace);
            }
            timings.push(bitMark); // Pulso final

            // Generar buffer estéreo desfasado
            let totalSamples = 0;
            timings.forEach(t => totalSamples += Math.round((t / 1000000) * audioCtx.sampleRate));

            let buffer = audioCtx.createBuffer(2, totalSamples, audioCtx.sampleRate);
            let channelL = buffer.getChannelData(0);
            let channelR = buffer.getChannelData(1);

            let currentSample = 0;
            let isMark = true;

            timings.forEach(durationUs => {
                let numSamples = Math.round((durationUs / 1000000) * audioCtx.sampleRate);
                for (let i = 0; i < numSamples; i++) {
                    if (isMark) {
                        let t = (currentSample + i) / audioCtx.sampleRate;
                        let val = Math.sin(2 * Math.PI * carrierFreq * t);
                        channelL[currentSample + i] = val;
                        channelR[currentSample + i] = -val; // Canal invertido 180°
                    } else {
                        channelL[currentSample + i] = 0;
                        channelR[currentSample + i] = 0;
                    }
                }
                currentSample += numSamples;
                isMark = !isMark;
            });

            let source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start();
        }
    </script>
</body>
</html>
